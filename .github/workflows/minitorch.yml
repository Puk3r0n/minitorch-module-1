name: minitorch

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Task 0.1 - Operators
        run: python -m pytest -m task0_1

      - name: Task 0.2 - Property testing
        run: python -m pytest -m task0_2

      - name: Task 0.3 - Higher-order functions
        run: python -m pytest -m task0_3

      - name: Task 0.4 - Modules
        run: python -m pytest -m task0_4

      - name: Task 1.1 - Central difference
        run: python -m pytest -m task1_1

      - name: Task 1.2 - Scalar forward
        run: python -m pytest -m task1_2

      - name: Task 1.3 - Chain rule
        run: python -m pytest -m task1_3

      - name: Task 1.4 - Backpropagation
        run: python -m pytest -m task1_4

      - name: Full test suite
        run: python -m pytest
